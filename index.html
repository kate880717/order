  .scale-stage {

    border-radius: 1.25rem;
    min-height: 100px;
    display: flex;
    align-items: center;
    padding: 12px 16px;

    background: #dcfce7;
    border-color: #22c55e;

/* ── 반응형 Scale 훅 ── */
const useScale = () => {
  const [scale, setScale] = useState(1);
  useEffect(() => {
    const calc = () => {
      const sx = window.innerWidth / 1280;
      const sy = window.innerHeight / 800;
      setScale(Math.min(sx, sy));
    };
    calc();
    window.addEventListener('resize', calc);
    window.addEventListener('orientationchange', calc);
    return () => {
      window.removeEventListener('resize', calc);
      window.removeEventListener('orientationchange', calc);
    };
  }, []);
  return scale;
};

/* ── 음성 시스템 (자연스러운 한국어) ── */
let bestVoice = null;
const findBestVoice = () => {
  if (!window.speechSynthesis) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;
  // 1순위: Google ko-KR (cloud)
  let v = voices.find(v => v.lang === 'ko-KR' && v.name.toLowerCase().includes('google') && !v.localService);
  if (v) return v;
  // 2순위: Wavenet/Neural2
  v = voices.find(v => v.lang === 'ko-KR' && /wavenet|neural/i.test(v.name));
  if (v) return v;
  // 3순위: 자연스러움 키워드
  v = voices.find(v => v.lang === 'ko-KR' && /premium|enhanced|natural/i.test(v.name));
  if (v) return v;
  // 4순위: ko-KR 아무거나 (Google 우선)
  v = voices.find(v => v.lang === 'ko-KR' && v.name.toLowerCase().includes('google'));
  if (v) return v;
  v = voices.find(v => v.lang === 'ko-KR');
  return v || null;
};
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => { bestVoice = findBestVoice(); };
  setTimeout(() => { bestVoice = findBestVoice(); }, 500);
}

const speak = (text, soundOn, opts={}) => {
  if (!soundOn || !window.speechSynthesis) return null;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR';
  u.rate = opts.rate || 0.95;
  u.pitch = 1.0;
  u.volume = 1.0;
  if (!bestVoice) bestVoice = findBestVoice();
  if (bestVoice) u.voice = bestVoice;
  if (opts.onboundary) u.onboundary = opts.onboundary;
  if (opts.onend) u.onend = opts.onend;
  window.speechSynthesis.speak(u);
  return u;
};

const playChime = (soundOn) => {
  if (!soundOn) return;
  try {
    const a = new (window.AudioContext||window.webkitAudioContext)();
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.frequency.setValueAtTime(523,t); o.frequency.setValueAtTime(659,t+.1); o.frequency.setValueAtTime(784,t+.2);
    g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.01,t+1);
    o.start(t); o.stop(t+1);
  } catch(e){}
};
const playWrong = (soundOn) => {

/* ── 수료증 캔버스 ── */
function generateCanvas(name, score, total) {
  const canvas = document.createElement('canvas');
  canvas.width = 800; canvas.height = 1100;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,800,1100);
  ctx.fillStyle = '#f8fafc'; ctx.fillRect(0,0,800,400);
  ctx.fillStyle = '#1e3a8a'; ctx.font = 'bold 50px "Malgun Gothic",sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('탐험 결과', 400, 80);
  ctx.fillStyle = '#334155'; ctx.font = 'bold 36px "Malgun Gothic",sans-serif';
  ctx.fillText(`총 ${total}문제 중 ${score}문제 정답!`, 400, 180);
  const cy = 400;
  ctx.fillStyle = '#fffbeb'; ctx.fillRect(0,cy,800,700);
  ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 10; ctx.setLineDash([20,15]);
  ctx.strokeRect(40,cy+40,720,620); ctx.setLineDash([]);
  ctx.font='80px Arial'; ctx.fillText('🏆',400,cy+160);
  ctx.fillStyle='#92400e'; ctx.font='bold 60px "Malgun Gothic",sans-serif';
  ctx.fillText('훌륭한 이야기꾼 상',400,cy+260);
  ctx.fillStyle='#333'; ctx.font='bold 44px "Malgun Gothic",sans-serif';
  ctx.fillText(`${name} 친구`,400,cy+360);
  ctx.font='32px "Malgun Gothic",sans-serif'; ctx.fillStyle='#475569';
  ctx.fillText('위 어린이는 주어진 사건의 순서를',400,cy+450);
  ctx.fillText('모두 올바르게 이해하고 설명하였기에',400,cy+500);
  ctx.fillText('이 상장을 수여합니다.',400,cy+550);
  ctx.font='26px "Malgun Gothic",sans-serif'; ctx.fillStyle='#94a3b8';
  const d = new Date();
  ctx.fillText(`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`,400,cy+630);
  return canvas;
}

/* ═══════════════════════════════════════════════════════════
   ── 순환형 퀴즈 슬롯 (원형 배치) ──
   ═══════════════════════════════════════════════════════════ */
const CyclicSlots = ({slots, onTapSlot, onDragOver, onDragLeave, onDrop, onDragStart, dragOverIndex, wrongIndices, size=500}) => {
  const n = slots.length;
  const R = size * 0.32; // 슬롯이 놓일 원의 반지름
  const cx = size / 2;
  const cy = size / 2;
  const slotW = 140; // 슬롯 너비
  const slotH = 140; // 슬롯 높이
  
  return (
    <div className="relative mx-auto" style={{width: size, height: size}}>
      {/* 원형 가이드 */}
      <svg className="absolute inset-0 w-full h-full pointer-events-none" viewBox={`0 0 ${size} ${size}`}>
        <circle cx={cx} cy={cy} r={R} fill="none" stroke="#86efac" strokeWidth="6" strokeDasharray="14 14"/>
        {/* 화살표: 슬롯 사이 방향 표시 */}
        {slots.map((_, i) => {
          const a1 = (i / n) * 2 * Math.PI - Math.PI / 2;
          const a2 = ((i + 1) / n) * 2 * Math.PI - Math.PI / 2;
          // 호의 중간 지점 + 약간 안쪽
          const am = (a1 + a2) / 2;
          const ax = cx + (R + 30) * Math.cos(am);
          const ay = cy + (R + 30) * Math.sin(am);
          // 화살표 방향: 접선
          const tx = -Math.sin(am);
          const ty = Math.cos(am);
          return (
            <g key={i}>
              <text x={ax} y={ay} fontSize="32" textAnchor="middle" alignmentBaseline="middle" fill="#22c55e" fontWeight="900">→</text>
            </g>
          );
        })}
        {/* 중심에 순환 표시 */}
        <text x={cx} y={cy - 8} fontSize="40" textAnchor="middle" fill="#16a34a">🔄</text>
        <text x={cx} y={cy + 32} fontSize="20" textAnchor="middle" fill="#16a34a" fontWeight="900">순환</text>
      </svg>
      
      {/* 슬롯들 */}
      {slots.map((card, i) => {
        const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
        const x = cx + R * Math.cos(angle) - slotW / 2;
        const y = cy + R * Math.sin(angle) - slotH / 2;
        const isWrong = wrongIndices.includes(i);
        const isDragOver = dragOverIndex === i;
        
        return (
          <div key={i}
            className={`absolute slot-box ${isDragOver ? 'drag-over' : ''} ${isWrong ? 'wrong-slot' : ''}`}
            style={{
              left: x, top: y, 
              width: slotW, height: slotH,
              minHeight: slotH,
              padding: '6px',
              flexDirection: 'column',
              borderRadius: '50%'
            }}
            onDragOver={(e) => onDragOver(e, i)}
            onDragLeave={onDragLeave}
            onDrop={(e) => onDrop(e, i)}>
            <div className="absolute" style={{
              top: '-8px', left: '50%', transform: 'translateX(-50%)',
              width: '32px', height: '32px',
              background: isWrong ? '#ef4444' : '#22c55e',
              color: 'white', borderRadius: '50%',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontWeight: 900, fontSize: '16px', zIndex: 2,
              boxShadow: '0 2px 6px rgba(0,0,0,0.2)'
            }}>{i + 1}</div>
            
            {card ? (
              <div
                draggable="true"
                onDragStart={(e) => onDragStart(e, i)}
                onClick={() => onTapSlot(card, i)}
                style={{
                  width: '100%', height: '100%',
                  display: 'flex', flexDirection: 'column',
                  alignItems: 'center', justifyContent: 'center',
                  cursor: 'grab', borderRadius: '50%'
                }}>
                <div style={{fontSize: '3rem', lineHeight: 1, pointerEvents: 'none'}}>{card.img}</div>
                <div style={{fontSize: '0.95rem', fontWeight: 900, color: '#334155', textAlign: 'center', marginTop: '4px', wordBreak: 'keep-all', pointerEvents: 'none'}}>{card.text}</div>
                {isWrong && <div className="absolute" style={{top: '50%', right: '6px', fontSize: '1.5rem', pointerEvents: 'none'}}>❌</div>}
              </div>
            ) : (
              <div style={{
                width: '100%', height: '100%',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontSize: '0.9rem', fontWeight: 900, color: '#cbd5e1', textAlign: 'center'
              }}>여기로</div>
            )}
          </div>
        );
      })}
    </div>
  );
};

const App = () => {

  const [selectedStudent, setSelectedStudent] = useState("");

  // 퀴즈 상태
  const [slots, setSlots] = useState([]);
  const [pool, setPool] = useState([]);
  const [draggedIndex, setDraggedIndex] = useState(null);
  const [dragOverIndex, setDragOverIndex] = useState(null);
  const [wrongIndices, setWrongIndices] = useState([]);
  const [practiceMode, setPracticeMode] = useState(false); // 연습 vs 본문제

  // 점수
  const [score, setScore] = useState(0);
  const [helpUsedTotal, setHelpUsedTotal] = useState(0);
  const [helpUsedCurrent, setHelpUsedCurrent] = useState(false);
  const [perQuestionResults, setPerQuestionResults] = useState([]); // {qId, correct, attempts, helpUsed}
  const [attempts, setAttempts] = useState(0); // 현재 문제 시도횟수

  // 소리
  const [soundOn, setSoundOn] = useState(false);

  // 마이크 / 녹음
  const [micGranted, setMicGranted] = useState(false);
  const mediaStreamRef = useRef(null);
  const [mediaRecorder, setMediaRecorder] = useState(null);
  const [isRecording, setIsRecording] = useState(false);
  const [audioBlob, setAudioBlob] = useState(null);
  const [audioBase64, setAudioBase64] = useState(null);
  const audioChunksRef = useRef([]);

  // 음성 인식 (실시간 텍스트)
  const recognitionRef = useRef(null);
  const [recognizedText, setRecognizedText] = useState('');
  const [interimText, setInterimText] = useState('');
  const [keyboardText, setKeyboardText] = useState('');
  const [useKeyboard, setUseKeyboard] = useState(false);

  // 녹음 단계 (5문제마다)
  const [reflectionRound, setReflectionRound] = useState(0); // 몇 번째 녹음 단계인가
  const [totalReflectionRounds, setTotalReflectionRounds] = useState(0);
  const [batchStart, setBatchStart] = useState(0); // 이번 배치 시작 인덱스
  const [selectedCardSets, setSelectedCardSets] = useState([]); // 학생이 선택한 2개 문제
  const [selfRating, setSelfRating] = useState(0);
  const [allReflections, setAllReflections] = useState([]); // 전체 녹음 결과 누적
  
  const currentQ = activeQuestions[qIndex];

  /* ── 데이터 로드 ── */
  useEffect(()=>{
    const loadData = async () => {
      if (!window.GAS_API_URL || window.GAS_API_URL.trim()==='') {
        setStudents(defaultStudents); setSelectedStudent(defaultStudents[0]);
        setAllQuestions(defaultQuestions); setPhase("login"); return;
      }
      try {
        const res = await fetch(window.GAS_API_URL);
        const data = await res.json();
        const sts = data.students?.length ? data.students : defaultStudents;
        setStudents(sts); setSelectedStudent(sts[0]);
        setAllQuestions(data.questions?.length ? data.questions : defaultQuestions);
        setPhase("login");
      } catch(e) {
        setStudents(defaultStudents); setSelectedStudent(defaultStudents[0]);
        setAllQuestions(defaultQuestions); setPhase("login");
      }
    };
    loadData();
  },[]);

  /* ── 마이크 1회 요청 ── */
  const requestMicAccess = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaStreamRef.current = stream;
      const recorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
      recorder.ondataavailable = (e) => { 
        if (e.data.size > 0) audioChunksRef.current.push(e.data); 
      };
      recorder.onstop = () => {
        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
        setAudioBlob(blob);
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onloadend = () => setAudioBase64(reader.result);
      };
      setMediaRecorder(recorder);
      setMicGranted(true);
      
      // 음성인식 초기화
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRec) {
        const r = new SpeechRec();
        r.lang = 'ko-KR';
        r.continuous = true;
        r.interimResults = true;
        r.onresult = (e) => {
          let interim = '', final = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) final += e.results[i][0].transcript + ' ';
            else interim += e.results[i][0].transcript;
          }
          if (final) setRecognizedText(prev => prev + final);
          setInterimText(interim);
        };
        r.onerror = (e) => console.log('음성인식 오류:', e.error);
        // 자동 재시작 (긴 녹음 시 끊김 방지)
        r.onend = () => {
          // 녹음 중인데 인식이 끝났으면 재시작
          if (window.__isRecordingActive) {
            try { r.start(); } catch(e){}
          }
        };
        recognitionRef.current = r;
      }
      
      if (!allQuestions.length) { 
        alert("문제가 없습니다. 구글 시트를 확인해주세요."); 
        return; 
      }
      setPhase("count_select");
    } catch(err) {
      const ok = confirm("마이크 권한이 거부되었습니다. 녹음 없이 진행할까요?");
      if (ok) {
        setMicGranted(false);
        if (!allQuestions.length) { 
          alert("문제가 없습니다."); 
          return; 
        }
        setPhase("count_select");
      }
    }
  };

  /* ── 게임 시작 ── */
  const startGame = (count) => {
    // 중복 없이 섞기 (Fisher-Yates)
    const shuffled = [...allQuestions];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    // 중복 ID 제거 (안전장치)
    const seen = new Set();
    const uniq = [];
    for (const q of shuffled) {
      if (!seen.has(q.id)) {
        seen.add(q.id);
        uniq.push(q);
      }
    }
    const s = uniq.slice(0, count);
    
    setActiveQuestions(s);
    setQIndex(0);
    setScore(0);
    setHelpUsedTotal(0);
    setPerQuestionResults([]);
    setReflectionRound(0);
    // 녹음 단계: 5문제마다 + 마지막에 남은 문제가 있으면 1회 더
    setTotalReflectionRounds(Math.ceil(count / 5));
    setBatchStart(0);
    setAllReflections([]);
    setTutorialOpen(true); // 튜토리얼 자동 오픈
    setPhase("concept");
  };

  /* ── 개념 → 연습 → 본문제 ── */
  const goToPractice = () => {
    // 연습: 첫 카드와 마지막 카드는 미리 채워두기 (힌트)
    const cards = currentQ.cards;
    const n = cards.length;
    const slots = new Array(n).fill(null);
    let pool = [...cards];
    
    if (n >= 3) {
      // 3개 이상: 첫째 + 마지막 힌트
      slots[0] = cards[0];
      slots[n-1] = cards[n-1];
      pool = cards.slice(1, n-1);
    } else if (n === 2) {
      // 2개: 첫째만 힌트
      slots[0] = cards[0];
      pool = [cards[1]];
    }
    // 카드 풀 섞기
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    
    setSlots(slots);
    setPool(pool);
    setWrongIndices([]);
    setPracticeMode(true);
    setHelpUsedCurrent(false);
    setAttempts(0);
    setPhase("practice");
  };

  const goToMainQuiz = () => {
    // 본 문제: 모든 카드 직접 배치
    const shuffled = [...currentQ.cards];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    setPool(shuffled);
    setSlots(new Array(currentQ.cards.length).fill(null));
    setWrongIndices([]);
    setPracticeMode(false);
    setAttempts(0);
    setPhase("quiz");
  };

  /* ── 카드 인터랙션 ── */
  const tapPoolCard = (card) => {
    const i = slots.findIndex(s=>s===null);
    if(i===-1) return;
    const ns = [...slots]; ns[i]=card; setSlots(ns);
    setPool(pool.filter(c=>c.id!==card.id));
    setWrongIndices([]);
    playPop(soundOn);
  };

  const tapSlotCard = (card, idx) => {
    if(!card) return;
    const ns = [...slots]; ns[idx]=null; setSlots(ns);
    setPool([...pool, card]);
    setWrongIndices([]);
  };

  // === 드래그 시스템 ===
  // source: { type: 'pool', cardId } | { type: 'slot', index }
  const [dragSource, setDragSource] = useState(null);
  
  const handlePoolDragStart = (e, card) => {
    setDragSource({ type: 'pool', cardId: card.id });
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', card.id);
    }
  };
  
  const handleSlotDragStart = (e, idx) => {
    if (!slots[idx]) return;
    setDragSource({ type: 'slot', index: idx });
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(idx));
    }
  };
  
  const handleDragOver = (e, idx) => { 
    e.preventDefault(); 
    if (dragOverIndex !== idx) setDragOverIndex(idx); 
  };
  const handleDragLeave = () => setDragOverIndex(null);
  
  const handleSlotDrop = (e, dropIdx) => {
    e.preventDefault();
    setDragOverIndex(null);
    if (!dragSource) return;
    
    setWrongIndices([]);
    
    if (dragSource.type === 'pool') {
      // 카드풀 → 슬롯
      const card = pool.find(c => c.id === dragSource.cardId);
      if (!card) { setDragSource(null); return; }
      const newSlots = [...slots];
      const newPool = pool.filter(c => c.id !== card.id);
      // 이미 그 슬롯에 카드가 있으면 풀로 되돌림
      if (newSlots[dropIdx]) {
        newPool.push(newSlots[dropIdx]);
      }
      newSlots[dropIdx] = card;
      setSlots(newSlots);
      setPool(newPool);
      playPop(soundOn);
    } else if (dragSource.type === 'slot') {
      // 슬롯 ↔ 슬롯 교환
      if (dragSource.index === dropIdx) { setDragSource(null); return; }
      const newSlots = [...slots];
      const tmp = newSlots[dragSource.index];
      newSlots[dragSource.index] = newSlots[dropIdx];
      newSlots[dropIdx] = tmp;
      setSlots(newSlots);
    }
    setDragSource(null);
  };
  
  // 카드풀에 드롭 (슬롯에서 빼기)
  const handlePoolDrop = (e) => {
    e.preventDefault();
    if (!dragSource || dragSource.type !== 'slot') { setDragSource(null); return; }
    const card = slots[dragSource.index];
    if (!card) { setDragSource(null); return; }
    const newSlots = [...slots];
    newSlots[dragSource.index] = null;
    setSlots(newSlots);
    setPool([...pool, card]);
    setDragSource(null);
    setWrongIndices([]);
  };

  /* ── 정답 확인 ── */
  const checkAnswer = () => {
    if (slots.includes(null)) { 
      alert("빈칸을 모두 채워주세요!");
      speak("빈칸을 모두 채워주세요!", soundOn);
      return; 
    }
    setAttempts(a => a + 1);
    
    const correctIds = currentQ.cards.map(c => c.id);
    const slotIds = slots.map(s => s.id);
    const n = correctIds.length;
    
    // 순환형: 어느 위치에서 시작하든 순서만 맞으면 정답
    let bestRotation = 0;
    let minWrongs = n + 1;
    let wrongIndices = [];
    
    if (currentQ.type === 'cyclic') {
      for (let r = 0; r < n; r++) {
        const wrongs = [];
        for (let i = 0; i < n; i++) {
          const expected = correctIds[(i + r) % n];
          if (slotIds[i] !== expected) wrongs.push(i);
        }
        if (wrongs.length < minWrongs) {
          minWrongs = wrongs.length;
          bestRotation = r;
          wrongIndices = wrongs;
        }
      }
    } else {
      // 직선형: 정확한 순서
      for (let i = 0; i < n; i++) {
        if (slotIds[i] !== correctIds[i]) wrongIndices.push(i);
      }
      minWrongs = wrongIndices.length;
    }
    
    if (minWrongs === 0) {
      // 정답
      if (!practiceMode) {
        setScore(s => s + 1);
        setPerQuestionResults(prev => [...prev, {
          qId: currentQ.id, 
          qTitle: currentQ.title,
          correct: true, 
          attempts: attempts + 1, 
          helpUsed: helpUsedCurrent
        }]);
      }
      playChime(soundOn); 
      fireConfetti(); 
      speak("정답입니다! 잘했어요!", soundOn);
      setPhase("feedback");
    } else {
      // 오답
      setWrongIndices(wrongIndices);
      playWrong(soundOn);
      speak(`${wrongIndices.length}개의 카드 위치가 다른 것 같아요. 빨간색 칸을 다시 옮겨봐요!`, soundOn);
    }
  };

  /* ── 다음 문제 ── */
  const nextQuestion = () => {
    if (practiceMode) {
      // 연습 끝 → 본 문제로 (qIndex 변화 없음)
      goToMainQuiz();
      return;
    }
    
    const nextIdx = qIndex + 1;
    const isLastQuestion = nextIdx >= activeQuestions.length;
    // 녹음 단계 진입 조건:
    //   1) 5문제 풀 때마다 (5, 10, 15...)
    //   2) 마지막 문제까지 풀었을 때 (배치에 남은 문제가 있으면)
    const reachFiveBoundary = nextIdx > 0 && nextIdx % 5 === 0;
    const hasUnreflectedBatch = isLastQuestion && (nextIdx - batchStart) > 0;
    
    if (reachFiveBoundary || hasUnreflectedBatch) {
      // 이번 배치 종료 → 녹음 단계
      setPhase("reflection_intro");
      return;
    }
    
    if (nextIdx < activeQuestions.length) {
      setQIndex(nextIdx);
      setPhase("concept");
    } else {
      // 녹음 없이 바로 종료 (이론상 거의 발생 안 함)
      finishQuiz();
    }
  };

  const retryQuestion = () => {
    const cards = [...slots.filter(it=>it), ...pool];
    setPool(cards.sort(()=>0.5-Math.random()));
    setSlots(new Array(currentQ.cards.length).fill(null));
    setWrongIndices([]);
    setPhase(practiceMode ? "practice" : "quiz");
  };

  /* ── 녹음 단계 시작 ── */
  const startReflection = () => {
    setSelectedCardSets([]);
    setPhase("reflection_select");
    speak("방금 푼 문제 중에서 설명하고 싶은 것을 골라주세요.", soundOn);
  };

  const goToRecording = () => {
    const batchEnd = qIndex + 1;
    const batchSize = batchEnd - batchStart;
    const requiredCount = Math.min(2, batchSize);
    if (selectedCardSets.length !== requiredCount) {
      alert(`카드 세트를 ${requiredCount}개 선택해주세요.`);
      return;
    }
    setRecognizedText('');
    setInterimText('');
    setKeyboardText('');
    setAudioBlob(null);
    setAudioBase64(null);
    setUseKeyboard(false);
    setSelfRating(0);
    setPhase("recording");
  };

  /* ── 녹음 컨트롤 ── */
  const handleStartRecording = () => {
    audioChunksRef.current = []; 
    setAudioBlob(null);
    setAudioBase64(null);
    setRecognizedText('');
    setInterimText('');
    if (mediaRecorder) {
      mediaRecorder.start();
      setIsRecording(true);
      window.__isRecordingActive = true;
      if (recognitionRef.current) {
        try { recognitionRef.current.start(); } catch(e){}
      }
    }
  };
  const handleStopRecording = () => {
    if (mediaRecorder && isRecording) {
      window.__isRecordingActive = false;
      mediaRecorder.stop();
      setIsRecording(false);
      if (recognitionRef.current) {
        try { recognitionRef.current.stop(); } catch(e){}
      }
      setPhase("reflection_listen");
    }
  };

  // 토스트 알림
  const [toast, setToast] = useState(null);
  const showToast = (msg, duration=2200) => {
    setToast(msg);
    setTimeout(() => setToast(null), duration);
  };

  /* ── 자기평가 후 처리 ── */
  const handleSelfEvaluate = (decision) => {
    console.log('[evaluate] decision=', decision, 'rating=', selfRating);
    
    // "다시 녹음" 버튼
    if (decision === 'redo') {
      setRecognizedText('');
      setInterimText('');
      setKeyboardText('');
      setAudioBlob(null);
      setAudioBase64(null);
      setSelfRating(0);
      setPhase("recording");
      return;
    }
    
    // 별점 미선택 → 토스트로 안내
    if (selfRating === 0) {
      try { showToast("⭐ 별점을 매겨볼까요?"); } catch(e){}
      try { speak("내 설명에 별점을 매겨볼까요?", soundOn); } catch(e){}
      return;
    }
    
    // 별 1-3개 → 자동으로 다시 녹음
    if (selfRating <= 3) {
      try { showToast("💪 한 번 더 도전해 봐요!"); } catch(e){}
      try { speak("좋아요! 한 번 더 도전해 볼까요?", soundOn); } catch(e){}
      setTimeout(() => {
        setRecognizedText('');
        setInterimText('');
        setKeyboardText('');
        setAudioBlob(null);
        setAudioBase64(null);
        setSelfRating(0);
        setPhase("recording");
      }, 800);
      return;
    }
    
    // ★★★ 별 4-5개 → 칭찬 받기 (가장 중요한 부분) ★★★
    // 모든 부수 효과를 try/catch로 감싸서 setPhase가 무조건 실행되게 함
    
    // 1. 결과 누적 (먼저!)
    const reflectionData = {
      round: reflectionRound + 1,
      selectedQuestions: selectedCardSets.map(q => q.title),
      transcript: useKeyboard ? keyboardText : (recognizedText + interimText).trim(),
      audioBase64: audioBase64,
      selfRating: selfRating,
      usedKeyboard: useKeyboard
    };
    setAllReflections(prev => [...prev, reflectionData]);
    
    // 2. 화면 전환 (먼저! 무조건 실행)
    setPhase("sticker_reward");
    
    // 3. 효과음/애니메이션 (실패해도 상관없음)
    try { fireSticker(); } catch(e) { console.log('sticker err:', e); }
    try { fireConfetti(); } catch(e) { console.log('confetti err:', e); }
    try { playChime(soundOn); } catch(e) { console.log('chime err:', e); }
    try { speak("멋진 설명이었어요! 칭찬 스티커를 받으세요!", soundOn); } catch(e) { console.log('speak err:', e); }
  };

  const continueAfterSticker = () => {
    const nextIdx = qIndex + 1;
    setReflectionRound(r => r + 1);
    setBatchStart(nextIdx);
    
    // 모든 문제를 풀었으면 종료, 아니면 다음 문제로
    if (nextIdx < activeQuestions.length) {
      setQIndex(nextIdx);
      setPhase("concept");
    } else {
      finishQuiz();
    }
  };

  /* ── 게임 종료 / 저장 ── */
  const finishQuiz = async () => {
    setPhase("submitting");
    const payload = {
      name: selectedStudent,
      score, total: activeQuestions.length,
      helpUsed: helpUsedTotal,
      perQuestion: perQuestionResults,
      reflections: allReflections
    };
    if (window.GAS_API_URL && window.GAS_API_URL.trim() !== '') {
      try { 
        await fetch(window.GAS_API_URL, {method:'POST', body: JSON.stringify(payload)}); 
      } catch(e) { console.error("저장 실패", e); }
    }
    setPhase("report");
    speak(`대단해요! ${activeQuestions.length}문제 중 ${score}문제를 맞췄어요.`, soundOn);
    fireConfetti();
  };

  const downloadReport = () => {
    const canvas = generateCanvas(selectedStudent, score, activeQuestions.length);
    const link = document.createElement('a');
    link.download = `순서대로말해요_수료증_${selectedStudent}.png`;
    link.href = canvas.toDataURL();
    link.click();
  };

  /* ===========================================================
     ── 화면 렌더링 ── (모두 1280x800 기준)
     =========================================================== */

  const renderContent = () => {
    if(phase==="loading") return (
      <div className="flex items-center justify-center w-full h-full">
        <div className="text-5xl font-black text-green-600 animate-pulse">불러오는 중...</div>
      </div>
    );

    if(phase==="login") return (
      <div className="flex items-center justify-center p-10 w-full h-full" style={{background:'linear-gradient(135deg, #fef3c7, #d1fae5, #dbeafe)'}}>
        <SoundToggle soundOn={soundOn} setSoundOn={setSoundOn}/>
        <div className="flex flex-row gap-12 w-full max-w-6xl items-center">
          {/* 왼쪽: 타이틀 */}
          <div className="flex-1 flex flex-col items-center text-center">
            <div className="mb-6 float-up" style={{
              fontSize: '8rem',
              filter:'drop-shadow(0 8px 16px rgba(0,0,0,0.2))'
            }}>📚</div>
            <h1 className="nowrap mb-5" style={{
              fontSize: '5rem',
              lineHeight: '1.2',
              color: '#15803d',
              textShadow: '0 4px 12px rgba(34,197,94,0.25)'
            }}>순서대로 말해요!</h1>
            <p style={{
              fontSize: '1.875rem',
              color: '#475569',
              lineHeight: '1.5',
              wordBreak: 'keep-all',
              marginTop: '1rem'
            }}>
              ✨ 그림 카드를 순서대로 놓으며<br/>
              사건의 흐름을 배워봐요!
            </p>
          </div>
          
          {/* 오른쪽: 입력 카드 */}
          <div className="flex-1 bg-white p-10 rounded-3xl border-8 border-green-200" style={{
            boxShadow:'0 20px 50px rgba(34,197,94,0.25), inset 0 0 0 4px white'
          }}>
            <p className="mb-4 flex items-center gap-2" style={{
              fontSize: '1.625rem',
              color: '#64748b'
            }}>
              <span style={{fontSize:'2rem'}}>👇</span> 내 이름을 골라요
            </p>
            <select className="w-full p-5 bg-green-50 border-4 border-green-300 rounded-2xl mb-6 text-slate-700 focus:outline-none focus:border-green-500 cursor-pointer"
              style={{fontSize: '2rem'}}
              value={selectedStudent} 
              onChange={e=>setSelectedStudent(e.target.value)}>
              {students.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
            <button onClick={() => setPhase("mic_request")} 
              className="w-full py-6 text-white rounded-3xl active:scale-95 transition-all hover:scale-105"
              style={{
                background:'linear-gradient(135deg, #22c55e, #16a34a)', 
                boxShadow:'0 10px 25px rgba(34,197,94,0.5), inset 0 -4px 0 rgba(0,0,0,0.15)',
                fontSize: '2rem'
              }}>
              🚀 시작하기
            </button>
          </div>
        </div>
      </div>
    );

    if(phase==="mic_request") return (
      <div className="flex items-center justify-center p-10 w-full h-full" style={{background:'linear-gradient(135deg, #e0e7ff, #c7d2fe)'}}>
        <SoundToggle soundOn={soundOn} setSoundOn={setSoundOn}/>
        <div className="bg-white p-10 rounded-3xl shadow-2xl border-8 border-indigo-200 max-w-2xl w-full text-center">
          <div className="text-9xl mb-6 float-up">🎤</div>
          <h2 className="text-5xl text-indigo-600 mb-4">마이크를 켜요</h2>
          <p className="text-2xl text-slate-600 word-keep mb-8" style={{lineHeight:'1.5'}}>
            내 목소리로<br/>
            이야기를 들려주려면<br/>
            <span className="text-indigo-600">마이크가 필요해요</span>
          </p>
          <button onClick={requestMicAccess} 
            className="w-full py-6 text-white rounded-3xl text-3xl shadow-xl active:scale-95 transition"
            style={{background:'linear-gradient(135deg, #6366f1, #4f46e5)'}}>
            🎙️ 마이크 켜기
          </button>
        </div>
      </div>
    );

    if(phase==="count_select") return (
      <div className="flex items-center justify-center p-10 w-full h-full" style={{background:'linear-gradient(135deg, #d1fae5, #a7f3d0, #fef3c7)'}}>
        <SoundToggle soundOn={soundOn} setSoundOn={setSoundOn}/>
        <div className="bg-white p-10 rounded-3xl shadow-2xl max-w-4xl w-full border-8 border-green-200 text-center">
          <h2 className="text-5xl text-slate-800 mb-8 word-keep">몇 문제 풀어볼까요?</h2>
          <div className="grid grid-cols-3 gap-6">
            <button onClick={()=>startGame(3)} 
              className="py-10 bg-green-50 border-8 border-green-200 hover:border-green-500 rounded-3xl text-3xl text-green-700 shadow-md active:scale-95 transition flex flex-col items-center gap-3">
              <span className="text-7xl">🌱</span>
              <span>3문제</span>
            </button>
            <button onClick={()=>startGame(5)} 
              className="py-10 bg-green-50 border-8 border-green-200 hover:border-green-500 rounded-3xl text-3xl text-green-700 shadow-md active:scale-95 transition flex flex-col items-center gap-3">
              <span className="text-7xl">🌿</span>
              <span>5문제</span>
            </button>
            <button onClick={()=>startGame(10)} 
              className="py-10 bg-green-50 border-8 border-green-200 hover:border-green-500 rounded-3xl text-3xl text-green-700 shadow-md active:scale-95 transition flex flex-col items-center gap-3">
              <span className="text-7xl">🌳</span>
              <span>10문제</span>
            </button>
          </div>
        </div>
      </div>
    );

    /* ── 개념 설명 ── */
    if(phase==="concept") return (
      <div className="flex items-center justify-center p-6 w-full h-full bg-green-50 relative">
        <SoundToggle soundOn={soundOn} setSoundOn={setSoundOn}/>
        <button onClick={() => setTutorialOpen(true)} 
          className="absolute top-4 left-4 z-40 px-4 py-2 bg-yellow-100 hover:bg-yellow-200 text-yellow-800 rounded-2xl font-black text-lg shadow-md border-4 border-yellow-300 active:scale-95">
          📖 사용설명서
        </button>
        <div className="w-full max-w-6xl bg-white rounded-3xl shadow-2xl border-b-8 border-green-300 flex flex-row overflow-hidden" style={{maxHeight:'720px'}}>
          <div className="flex-1 p-10 flex flex-col justify-between">
            <div>
              <div className="inline-block bg-green-100 text-green-700 font-black px-5 py-2 rounded-full mb-5 text-xl">
                문제 {qIndex+1} / {activeQuestions.length}
              </div>
              <h2 className="text-5xl font-black mb-6 text-slate-800 word-keep">{currentQ.title}</h2>
              <div className="bg-slate-50 p-6 rounded-2xl border-4 border-slate-100 mb-5">
                <p className="text-3xl font-bold text-slate-700 word-keep leading-relaxed border-l-8 border-green-300 pl-5">
                  "{currentQ.concept}"
                </p>
              </div>
              <button onClick={() => {
                setHelpUsedCurrent(true);
                setHelpUsedTotal(h => h+1);
                let charIdx = 0;
                const helper = (text) => {
                  if (!soundOn) {
                    try {
                      const u = new SpeechSynthesisUtterance(text);
                      u.lang='ko-KR'; u.rate=0.85; u.pitch=1.0;
                      if (!bestVoice) bestVoice = findBestVoice();
                      if (bestVoice) u.voice = bestVoice;
                      window.speechSynthesis.cancel();
                      window.speechSynthesis.speak(u);
                    } catch(e){}
                  } else {
                    speak(text, true, {rate:0.85});
                  }
                };
                helper(currentQ.concept);
              }} className="px-6 py-3 bg-yellow-300 hover:bg-yellow-400 text-yellow-900 rounded-2xl font-black text-xl shadow-lg border-4 border-yellow-500 active:scale-95 transition flex items-center gap-2">
                <span className="text-3xl">🙋</span> 도움받기 (읽어주기)
              </button>
            </div>
            <button onClick={goToPractice} 
              className="mt-6 w-full py-6 bg-blue-500 hover:bg-blue-600 text-white rounded-2xl font-black text-3xl shadow-xl active:scale-95 transition flex items-center justify-center gap-3">
              🌟 연습 문제 풀기 ▶
            </button>
          </div>
          <div className="flex-1 bg-green-50 flex items-center justify-center p-8 border-l-8 border-green-100">
            {currentQ.type === 'cyclic' ? <CircularLayout items={currentQ.cards} size={400}/> : <LinearLayout items={currentQ.cards}/>}
          </div>
        </div>
      </div>
    );

    /* ── 퀴즈 (연습/본문제 공용) ── */
    if(phase==="quiz" || phase==="practice") {
      const isCyclic = currentQ.type === 'cyclic';
      const filledCount = slots.filter(s => s !== null).length;
      const totalCount = slots.length;
      
      return (
        <div className="flex flex-col p-3 w-full h-full bg-green-50 relative">
          <SoundToggle soundOn={soundOn} setSoundOn={setSoundOn}/>
          {/* 헤더 */}
          <div className="w-full max-w-6xl mx-auto bg-white px-5 py-2 rounded-2xl shadow-md border-4 border-green-200 flex items-center justify-between flex-shrink-0 mb-2">
            <div className="flex items-center gap-2">
              <span className={`px-3 py-1 rounded-full text-sm ${practiceMode ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'}`}>
                {practiceMode ? '🌟 연습 (힌트 있음)' : '📝 본 문제'}
              </span>
              <span className={`px-2 py-1 rounded-full text-xs ${isCyclic ? 'bg-purple-100 text-purple-700' : 'bg-orange-100 text-orange-700'}`}>
                {isCyclic ? '🔄 순환형' : '➡️ 순서형'}
              </span>
              <span className="text-slate-500 text-base">{qIndex+1}/{activeQuestions.length}</span>
            </div>
            <h2 className="text-2xl text-slate-800">{currentQ.title}</h2>
            <button onClick={() => {
              setHelpUsedCurrent(true);
              setHelpUsedTotal(h => h+1);
              const helper = (text) => {
                if (!soundOn) {
                  try {
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang='ko-KR'; u.rate=0.85; u.pitch=1.0;
                    if (!bestVoice) bestVoice = findBestVoice();
                    if (bestVoice) u.voice = bestVoice;
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.speak(u);
                  } catch(e){}
                } else { speak(text, true, {rate:0.85}); }
              };
              helper(currentQ.concept);
            }} className="px-3 py-2 bg-yellow-300 hover:bg-yellow-400 text-yellow-900 rounded-2xl text-sm shadow-md border-4 border-yellow-500 active:scale-95 flex items-center gap-1">
              <span className="text-xl">🙋</span> 도움
            </button>
          </div>

          {/* 안내 메시지 */}
          <div className="w-full max-w-6xl mx-auto bg-yellow-50 border-4 border-yellow-300 rounded-2xl px-4 py-2 mb-2 flex-shrink-0 flex items-center justify-center gap-3">
            <span className="text-2xl hand-drag" style={{display:'inline-block'}}>👆</span>
            <p className="text-base text-yellow-800 text-center word-keep">
              <strong className="text-orange-600">카드를 끌어서</strong> 빈칸에 놓아보세요! 
              {practiceMode && <span className="ml-2">처음과 끝은 미리 채워져 있어요 💡</span>}
              {isCyclic && !practiceMode && <span className="ml-2">🔄 어느 위치에서 시작해도 OK!</span>}
            </p>
          </div>
          
          {/* 메인 영역 */}
          <div className="flex-1 w-full max-w-6xl mx-auto flex flex-row gap-3 overflow-hidden">
            {/* 왼쪽: 슬롯 (직선형 또는 원형) */}
            <div className="flex-1 bg-white rounded-3xl p-4 border-4 border-slate-100 shadow-md flex flex-col overflow-hidden">
              <div className="flex items-center justify-between mb-2 flex-shrink-0">
                <h3 className="text-lg text-slate-500">📌 순서대로 채우기</h3>
                <span className="text-sm text-green-600">{filledCount}/{totalCount}</span>
              </div>
              
              {isCyclic ? (
                /* ── 순환형: 원형 슬롯 ── */
                <div className="flex-1 flex items-center justify-center overflow-hidden">
                  <CyclicSlots
                    slots={slots}
                    onTapSlot={tapSlotCard}
                    onDragOver={handleDragOver}
                    onDragLeave={handleDragLeave}
                    onDrop={handleSlotDrop}
                    onDragStart={handleSlotDragStart}
                    dragOverIndex={dragOverIndex}
                    wrongIndices={wrongIndices}
                    size={460}
                  />
                </div>
              ) : (
                /* ── 직선형: 세로 슬롯 ── */
                <div className="flex-1 flex flex-col justify-around overflow-hidden gap-2">
                  {slots.map((card, idx) => (
                    <div key={idx}
                      className={`slot-box ${dragOverIndex===idx ? 'drag-over' : ''} ${wrongIndices.includes(idx) ? 'wrong-slot' : ''}`}
                      onDragOver={(e)=>handleDragOver(e,idx)}
                      onDragLeave={handleDragLeave}
                      onDrop={(e)=>handleSlotDrop(e,idx)}>
                      <div className="flex-shrink-0 w-12 h-12 bg-slate-200 rounded-full flex items-center justify-center text-slate-600 mr-4 text-2xl">
                        {idx+1}
                      </div>
                      {card ? (
                        <div className="drag-card flex-1"
                          draggable="true"
                          onDragStart={(e)=>handleSlotDragStart(e,idx)}
                          onClick={()=>tapSlotCard(card,idx)}>
                          <div className="text-5xl mr-4 pointer-events-none">{card.img}</div>
                          <div className="text-2xl text-slate-700 word-keep pointer-events-none">{card.text}</div>
                          {wrongIndices.includes(idx) && <div className="ml-auto text-3xl pointer-events-none">❌</div>}
                        </div>
                      ) : (
                        <div className="flex-1 text-xl text-slate-300 flex items-center gap-2">
                          <span className="text-3xl">👉</span> 카드를 여기로 끌어오세요
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
              
              {wrongIndices.length > 0 && (
                <div className="mt-2 p-2 bg-red-50 border-4 border-red-200 rounded-2xl flex-shrink-0">
                  <p className="text-base text-red-600 word-keep">
                    🤔 빨간 칸의 카드를 움직여서 순서를 다시 맞춰봐요!
                  </p>
                </div>
              )}
            </div>
            
            {/* 오른쪽: 카드풀 + 버튼 */}
            <div className="flex flex-col gap-2 overflow-hidden" style={{width: '320px', flexShrink: 0}}>
              <div 
                className="flex-1 bg-blue-50 rounded-3xl p-3 border-4 border-blue-200 flex flex-col overflow-hidden"
                onDragOver={(e) => e.preventDefault()}
                onDrop={handlePoolDrop}>
                <h3 className="text-lg text-blue-700 mb-2 flex-shrink-0 flex items-center gap-2">
                  🃏 카드 보관함
                  <span className="text-xs text-slate-500 ml-auto">끌어서 놓기 ✋</span>
                </h3>
                <div className="flex-1 flex flex-wrap gap-2 content-start justify-center overflow-hidden">
                  {pool.length > 0 ? pool.map(card => (
                    <div key={card.id}
                      draggable="true"
                      onDragStart={(e) => handlePoolDragStart(e, card)}
                      onClick={() => tapPoolCard(card)}
                      className={`pool-card flex flex-col items-center ${dragSource && dragSource.type === 'pool' && dragSource.cardId === card.id ? 'dragging' : ''}`}
                      style={{padding:'10px 12px', width:'130px'}}>
                      <div className="text-5xl mb-1">{card.img}</div>
                      <div className="text-base text-slate-700 text-center word-keep">{card.text}</div>
                    </div>
                  )) : (
                    <div className="text-lg text-slate-400 text-center p-4 w-full">
                      모두 옮겼어요! 🎉<br/>
                      <span className="text-sm">정답을 확인해보세요 👇</span>
                    </div>
                  )}
                </div>
              </div>
              <div className="flex gap-2 flex-shrink-0">
                <button onClick={retryQuestion} 
                  className="flex-1 py-4 bg-slate-400 hover:bg-slate-500 text-white rounded-3xl text-lg shadow-lg active:scale-95">
                  🔄 다시
                </button>
                <button onClick={checkAnswer} 
                  className="flex-[2] py-4 text-white rounded-3xl text-lg shadow-lg active:scale-95"
                  style={{background: 'linear-gradient(135deg, #22c55e, #16a34a)'}}>
                  정답 확인 ✅
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ── 정답 피드백 ── */
    if(phase==="feedback") {
      const nextIdx = qIndex + 1;
      const isLastQuestion = nextIdx >= activeQuestions.length;
      const reachFiveBoundary = nextIdx > 0 && nextIdx % 5 === 0;
      const willEnterReflection = !practiceMode && (reachFiveBoundary || (isLastQuestion && (nextIdx - batchStart) > 0));
      
      let nextLabel;
      if (practiceMode) {
        nextLabel = '본 문제 풀기 📝';
      } else if (willEnterReflection) {
        nextLabel = '배움 정리하기 🎙️';
      } else if (isLastQuestion) {
        nextLabel = '결과 보기 🏆';
      } else {
        nextLabel = '다음 문제 ▶';
      }
      
      return (
        <div className="flex items-center justify-center p-6 w-full h-full bg-green-50">
          <SoundToggle soundOn={soundOn} setSoundOn={setSoundOn}/>
          <div className="w-full max-w-5xl bg-white p-8 rounded-3xl shadow-2xl border-8 border-green-300 flex flex-row gap-8 items-center">
            <div className="flex-shrink-0 flex flex-col items-center">
              <div className="text-9xl mb-3 sticker-pop">🎉</div>
              <h2 className="text-5xl font-black text-green-500">정답!</h2>
              {practiceMode && <span className="mt-2 px-4 py-1 bg-blue-100 text-blue-700 rounded-full font-black text-lg">연습 완료</span>}
            </div>
            <div className="flex-1 flex flex-col gap-5">
              <p className="text-2xl font-black text-slate-700 word-keep leading-relaxed border-l-8 border-green-300 pl-4">
                "{currentQ.concept}"
              </p>
              <div className="bg-green-50 p-5 rounded-2xl flex items-center justify-center" style={{minHeight:'300px'}}>
                {currentQ.type === 'cyclic' ? <CircularLayout items={currentQ.cards} size={340}/> : <LinearLayout items={currentQ.cards}/>}
              </div>
              <button onClick={nextQuestion} 
                className="w-full py-6 bg-blue-500 hover:bg-blue-600 text-white rounded-2xl font-black text-3xl shadow-xl active:scale-95 transition">
                {nextLabel}
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ── 녹음 단계 1: 안내 ── */
    if(phase==="reflection_intro") {
      const batchEnd = qIndex + 1;
      const batchSize = batchEnd - batchStart;
      const isFinalRound = batchEnd >= activeQuestions.length;
      // 카드세트 2개 미만이면 안내 메시지 변경
      const canSelectTwo = batchSize >= 2;
      return (
        <div className="flex items-center justify-center p-8 w-full h-full bg-orange-50">
          <SoundToggle soundOn={soundOn} setSoundOn={setSoundOn}/>
          <div className="bg-white rounded-3xl p-10 max-w-4xl w-full shadow-2xl border-8 border-orange-300 text-center">
            <div className="text-9xl mb-4">🎙️</div>
            <h2 className="text-5xl font-black text-orange-600 mb-4">배움 정리 시간!</h2>
            <p className="text-3xl font-black text-slate-700 word-keep leading-relaxed mb-6">
              방금 푼 <span className="text-orange-500">{batchSize}개 문제</span> 중에서<br/>
              {canSelectTwo ? (
                <><span className="text-orange-500">2개를 골라</span> 친구에게 설명해 보아요.</>
              ) : (
                <>그 문제를 친구에게 설명해 보아요.</>
              )}
            </p>
            <div className="bg-orange-50 p-5 rounded-2xl border-4 border-orange-200 mb-6">
              <p className="text-2xl font-bold text-slate-600 word-keep">
                🎯 녹음 단계 <span className="text-orange-600">{reflectionRound + 1}</span> / <span>{totalReflectionRounds}</span>
                {isFinalRound && <span className="ml-2 text-pink-600">(마지막!)</span>}
              </p>
            </div>
            <button onClick={startReflection} 
              className="w-full py-6 bg-orange-500 hover:bg-orange-600 text-white rounded-2xl font-black text-3xl shadow-xl active:scale-95 transition">
              카드 고르러 가기 ▶
            </button>
          </div>
        </div>
      );
    }

    /* ── 녹음 단계 2: 카드 2개 선택 ── */
    if(phase==="reflection_select") {
      const batchEnd = qIndex + 1;
      const batchQuestions = activeQuestions.slice(batchStart, batchEnd);
      // 배치에 문제가 1개뿐이면 자동 선택, 2개 이상이면 사용자가 2개 고르기
      const requiredCount = Math.min(2, batchQuestions.length);
      const canProceed = selectedCardSets.length === requiredCount;
      
      return (
        <div className="flex flex-col p-6 w-full h-full bg-orange-50">
          <SoundToggle soundOn={soundOn} setSoundOn={setSoundOn}/>
          <div className="w-full max-w-6xl mx-auto flex-shrink-0 mb-4">
            <h2 className="text-4xl font-black text-orange-600 text-center mb-2">
              🎯 설명할 카드 {requiredCount}개를 골라요
            </h2>
            <p className="text-xl font-bold text-slate-600 text-center">
              선택됨: <span className="text-orange-600 text-2xl">{selectedCardSets.length}</span> / {requiredCount}
            </p>
          </div>
          <div className="flex-1 w-full max-w-6xl mx-auto overflow-hidden">
            <div className="grid grid-cols-2 gap-4 h-full content-start" style={{gridAutoRows:'min-content'}}>
              {batchQuestions.map((q) => {
                const isSelected = selectedCardSets.find(c => c.id === q.id);
                return (
                  <div key={q.id} 
                    onClick={() => {
                      if (isSelected) {
                        setSelectedCardSets(selectedCardSets.filter(c => c.id !== q.id));
                      } else if (selectedCardSets.length < requiredCount) {
                        setSelectedCardSets([...selectedCardSets, q]);
                        playPop(soundOn);
                      }
                    }}
                    className={`bg-white rounded-2xl p-4 shadow-md border-8 cursor-pointer transition active:scale-98 ${isSelected ? 'border-orange-500 bg-orange-50' : 'border-slate-200 hover:border-orange-300'}`}>
                    <div className="flex items-center justify-between mb-2">
                      <h3 className="text-2xl font-black text-slate-800">{q.title}</h3>
                      {isSelected && <div className="text-4xl">✅</div>}
                    </div>
                    <p className="text-base font-bold text-slate-600 mb-3 word-keep">"{q.concept}"</p>
                    <div className="flex flex-wrap gap-2 items-center">
                      {q.cards.map((c, ci) => (
                        <React.Fragment key={c.id}>
                          <div className="flex flex-col items-center">
                            <div className="text-3xl bg-slate-50 rounded-xl p-1 border-2 border-slate-200">{c.img}</div>
                            <span className="text-xs font-bold text-slate-600">{c.text}</span>
                          </div>
                          {ci < q.cards.length-1 && <span className="text-blue-400 font-black">→</span>}
                        </React.Fragment>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
          <div className="flex-shrink-0 w-full max-w-6xl mx-auto mt-4">
            <button onClick={goToRecording} disabled={!canProceed}
              className={`w-full py-5 rounded-2xl font-black text-2xl shadow-xl transition ${canProceed ? 'bg-orange-500 hover:bg-orange-600 text-white active:scale-95' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}>
              {canProceed ? '녹음하러 가기 🎙️' : `${requiredCount - selectedCardSets.length}개 더 골라주세요`}
            </button>
          </div>
        </div>
      );
    }

    /* ── 녹음 단계 3: 녹음 ── */
    if(phase==="recording") return (
      <div className="flex flex-col p-3 w-full h-full bg-orange-50 relative">
        <SoundToggle soundOn={soundOn} setSoundOn={setSoundOn}/>
        <div className="w-full max-w-6xl mx-auto flex-1 flex flex-row gap-3 overflow-hidden">
          {/* 왼쪽: 선택한 카드 (그림 + 예시 문장 항상 표시) */}
          <div className="flex-1 bg-white rounded-3xl p-4 border-8 border-orange-200 shadow-md overflow-hidden flex flex-col">
            <h3 className="text-xl text-orange-600 mb-1 flex-shrink-0">📚 내가 고른 이야기</h3>
            <p className="text-sm text-slate-500 mb-2 flex-shrink-0 word-keep">
              그림을 보면서 <strong className="text-orange-600">내 말로</strong> 설명해요!
            </p>
            <div className="flex-1 flex flex-col gap-2 overflow-hidden">
              {selectedCardSets.map((q, i) => (
                <div key={q.id} className="bg-orange-50 rounded-2xl p-3 border-4 border-orange-200 flex flex-col gap-2">
                  <h4 className="text-lg text-slate-700 flex items-center gap-2">
                    <span className="bg-orange-300 text-white rounded-full w-7 h-7 flex items-center justify-center text-base flex-shrink-0">{i+1}</span>
                    <span className="truncate">{q.title}</span>
                  </h4>
                  
                  {/* 카드 그림 (작게) */}
                  <div className="flex flex-wrap gap-1 items-center justify-center bg-white p-2 rounded-2xl">
                    {q.cards.map((c, ci) => (
                      <React.Fragment key={c.id}>
                        <div className="flex flex-col items-center">
                          <div className="bg-slate-50 rounded-xl border-2 border-blue-200" 
                            style={{width:'52px',height:'52px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'2rem'}}>
                            {c.img}
                          </div>
                          <span className="text-xs text-slate-700 mt-0.5">{c.text}</span>
                        </div>
                        {ci < q.cards.length-1 && <span className="text-blue-400 text-lg">→</span>}
                      </React.Fragment>
                    ))}
                  </div>
                  
                  {/* 예시 문장 + 듣기 (항상 표시) */}
                  <div className="bg-yellow-50 rounded-2xl border-4 border-yellow-200 p-2 flex items-center gap-2">
                    <p className="text-sm text-slate-700 word-keep flex-1" style={{lineHeight:'1.4'}}>
                      💡 예시: <span className="italic">"{q.concept}"</span>
                    </p>
                    <button onClick={() => {
                      const helper = (text) => {
                        if (!soundOn) {
                          try {
                            const u = new SpeechSynthesisUtterance(text);
                            u.lang='ko-KR'; u.rate=0.85; u.pitch=1.0;
                            if (!bestVoice) bestVoice = findBestVoice();
                            if (bestVoice) u.voice = bestVoice;
                            window.speechSynthesis.cancel();
                            window.speechSynthesis.speak(u);
                          } catch(e){}
                        } else { speak(text, true, {rate:0.85}); }
                      };
                      helper(q.concept);
                    }} className="px-2 py-1 bg-yellow-300 hover:bg-yellow-400 text-yellow-900 rounded-xl text-sm border-2 border-yellow-500 active:scale-95 flex-shrink-0">
                      🔊
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
          
          {/* 오른쪽: 녹음 / 키보드 */}
          <div className="flex-1 bg-white rounded-3xl p-4 border-8 border-orange-300 shadow-md overflow-hidden flex flex-col">
            <div className="flex items-center justify-between mb-2 flex-shrink-0">
              <h3 className="text-xl text-orange-600">🎙️ 내가 설명하기</h3>
              <button onClick={() => setUseKeyboard(!useKeyboard)}
                className="px-3 py-1 bg-purple-100 hover:bg-purple-200 text-purple-700 rounded-2xl text-sm border-4 border-purple-300">
                {useKeyboard ? '🎤 음성으로' : '⌨️ 키보드로'}
              </button>
            </div>
            
            {useKeyboard ? (
              <textarea
                value={keyboardText}
                onChange={(e) => setKeyboardText(e.target.value)}
                placeholder="여기에 내 생각을 써보세요! 😊"
                className="flex-1 w-full p-4 text-xl text-slate-700 bg-purple-50 border-4 border-purple-200 rounded-2xl resize-none focus:outline-none focus:border-purple-500"
              />
            ) : (
              <>
                {/* 녹음 버튼 */}
                <div className="flex-shrink-0 mb-2">
                  {!isRecording && !audioBlob && (
                    <button onClick={handleStartRecording} 
                      className="w-full bg-slate-100 border-8 border-slate-300 py-6 rounded-3xl flex items-center justify-center gap-3 cursor-pointer active:scale-95 transition shadow-lg text-slate-500 hover:border-orange-300 hover:text-orange-500">
                      <span className="text-5xl">🎤</span>
                      <span className="text-2xl">녹음 시작</span>
                    </button>
                  )}
                  {isRecording && (
                    <button onClick={handleStopRecording} 
                      className="w-full bg-red-100 border-8 border-red-500 py-6 rounded-3xl flex items-center justify-center gap-3 cursor-pointer active:scale-95 transition shadow-lg text-red-600 recording-pulse">
                      <span className="text-5xl">⏹️</span>
                      <span className="text-2xl">녹음 끝</span>
                    </button>
                  )}
                </div>
                
                {/* 실시간 텍스트 */}
                <div className="flex-1 bg-slate-50 p-3 rounded-2xl border-4 border-slate-200 overflow-y-auto">
                  <p className="text-sm text-slate-500 mb-1">📝 받아쓰기</p>
                  <p className="text-lg text-slate-700 word-keep" style={{lineHeight:'1.5'}}>
                    {recognizedText || <span className="text-slate-400">{isRecording ? '말해보세요...' : '🎤 녹음 시작 버튼을 눌러요'}</span>}
                    {interimText && <span className="text-orange-400">{interimText}</span>}
                  </p>
                </div>
              </>
            )}
          </div>
        </div>
        
        {/* 하단 버튼 */}
        <div className="w-full max-w-6xl mx-auto mt-2 flex gap-3 flex-shrink-0">
          <button onClick={() => setPhase("reflection_select")}
            className="flex-1 py-3 bg-slate-300 hover:bg-slate-400 text-slate-700 rounded-3xl text-lg shadow-lg active:scale-95">
            ← 카드 다시 고르기
          </button>
          {(audioBlob || (useKeyboard && keyboardText.trim().length > 0)) && (
            <button onClick={() => setPhase("reflection_listen")}
              className="flex-[2] py-3 text-white rounded-3xl text-lg shadow-lg active:scale-95"
              style={{background:'linear-gradient(135deg, #f97316, #ea580c)'}}>
              들어보기 / 자기평가 →
            </button>
          )}
        </div>
      </div>
    );

    /* ── 녹음 단계 4: 들어보기 + 자기평가 ── */
    if(phase==="reflection_listen") return (
      <div className="flex flex-col p-6 w-full h-full bg-orange-50 overflow-hidden">
        <SoundToggle soundOn={soundOn} setSoundOn={setSoundOn}/>
        <div className="w-full max-w-5xl mx-auto flex-1 flex flex-col overflow-hidden gap-4">
          <h2 className="text-4xl text-orange-600 text-center flex-shrink-0">🎧 내 설명을 들어보고 평가해요</h2>
          
          <div className="bg-white rounded-3xl p-5 border-8 border-orange-200 shadow-md flex-shrink-0">
            <h3 className="text-2xl text-slate-700 mb-3">🎙️ 내 설명</h3>
            {useKeyboard ? (
              <div className="bg-purple-50 p-4 rounded-2xl border-4 border-purple-200">
                <p className="text-xl text-slate-700 word-keep" style={{lineHeight:'1.6'}}>{keyboardText || '(입력 내용 없음)'}</p>
              </div>
            ) : (
              <>
                {audioBlob && <audio src={URL.createObjectURL(audioBlob)} controls className="w-full mb-3 rounded-full shadow-md"></audio>}
                <div className="bg-slate-50 p-3 rounded-2xl border-4 border-slate-200">
                  <p className="text-base text-slate-500 mb-1">📝 받아쓰기 결과</p>
                  <p className="text-lg text-slate-700 word-keep" style={{lineHeight:'1.6'}}>{recognizedText || '(받아쓰기 결과 없음)'}</p>
                </div>
              </>
            )}
          </div>
          
          <div className="bg-white rounded-3xl p-5 border-8 border-yellow-300 shadow-md flex-1 flex flex-col justify-center">
            <h3 className="text-3xl text-yellow-700 text-center mb-2">⭐ 별점으로 평가해요</h3>
            <p className="text-lg text-slate-500 text-center mb-3 word-keep">
              나는 얼마나 잘 설명했나요?
            </p>
            <StarRating rating={selfRating} setRating={setSelfRating} size={70}/>
            {selfRating > 0 && (
              <p className="text-2xl text-center mt-3" style={{
                color: selfRating <= 3 ? '#ea580c' : '#16a34a'
              }}>
                {selfRating === 5 && '✨ 정말 멋지게 설명했어요!'}
                {selfRating === 4 && '😊 잘 설명했어요!'}
                {selfRating === 3 && '🌟 좋아요! 한 번 더 해볼까요?'}
                {selfRating === 2 && '💪 시도한 게 멋져요! 한 번 더!'}
                {selfRating === 1 && '🌱 용기 있게 도전했어요! 한 번 더!'}
              </p>
            )}
          </div>
          
          <div className="flex gap-3 flex-shrink-0">
            <button onClick={() => handleSelfEvaluate('redo')}
              className="flex-1 py-5 text-white rounded-3xl text-xl shadow-lg active:scale-95"
              style={{background:'linear-gradient(135deg, #a855f7, #9333ea)'}}>
              🔄 다시 녹음하기
            </button>
            <button onClick={() => handleSelfEvaluate('submit')}
              className="flex-[2] py-5 text-white rounded-3xl text-xl shadow-lg active:scale-95"
              style={{background:'linear-gradient(135deg, #22c55e, #16a34a)'}}>
              ✅ 만족! 칭찬 받으러 가기
            </button>
          </div>
        </div>
      </div>
    );

    /* ── 녹음 단계 5: 칭찬 스티커 ── */
    if(phase==="sticker_reward") return (
      <div className="flex items-center justify-center p-8 w-full h-full" style={{background:'linear-gradient(135deg, #fce7f3, #fbcfe8, #fef3c7)'}}>
        <SoundToggle soundOn={soundOn} setSoundOn={setSoundOn}/>
        <div className="bg-white rounded-3xl p-10 max-w-4xl w-full shadow-2xl border-8 border-pink-300 text-center">
          <div className="text-9xl mb-4 sticker-pop">🏆</div>
          <h2 className="text-5xl text-pink-600 mb-4">멋진 설명이었어요!</h2>
          <p className="text-3xl text-slate-700 word-keep mb-6" style={{lineHeight:'1.5'}}>
            <span className="text-pink-500">{selectedStudent}</span> 친구가<br/>
            <span className="text-pink-500">칭찬 스티커</span>를 받았어요! 🎉
          </p>
          <div className="flex justify-center gap-3 mb-6">
            {[1,2,3,4,5].map(s => (
              <div key={s} className="sticker-pop" style={{animationDelay:`${s*0.1}s`}}>
                <RoundStar filled={s <= selfRating} size={70}/>
              </div>
            ))}
          </div>
          <div className="bg-pink-50 p-5 rounded-3xl border-4 border-pink-200 mb-6">
            <p className="text-2xl text-slate-700">
              자기평가: <span className="text-pink-600">{selfRating}점</span>
            </p>
          </div>
          <button onClick={continueAfterSticker} 
            className="w-full py-6 text-white rounded-3xl text-3xl shadow-xl active:scale-95 transition"
            style={{background:'linear-gradient(135deg, #ec4899, #db2777)'}}>
            {qIndex+1 < activeQuestions.length ? '다음 문제 풀기 ▶' : '결과 보러 가기 🏆'}
          </button>
        </div>
      </div>
    );

    /* ── 전송 중 ── */
    if(phase==="submitting") return (
      <div className="flex flex-col items-center justify-center w-full h-full text-center bg-white">
        <div className="text-9xl mb-6 animate-spin">⏳</div>
        <div className="text-3xl font-black text-slate-600">선생님께 멋진 결과를 보내는 중이에요...</div>
      </div>
    );

    /* ── 결과 보고 ── */
    if(phase==="report") return (
      <div className="flex items-center justify-center p-6 w-full h-full bg-green-50">
        <SoundToggle soundOn={soundOn} setSoundOn={setSoundOn}/>
        <div className="bg-white p-10 rounded-3xl shadow-2xl max-w-6xl w-full border-8 border-amber-300 flex flex-row gap-8">
          <div className="flex-1 bg-amber-50 p-7 rounded-2xl border-4 border-dashed border-amber-300 flex flex-col justify-center items-center text-center">
            <div className="text-8xl mb-3">🏆</div>
            <h1 className="text-4xl font-black text-amber-800 mb-4">훌륭한 이야기꾼 상</h1>
            <div className="text-3xl font-black text-slate-600 mb-5">
              <span className="text-indigo-600 underline decoration-4 text-5xl">{selectedStudent}</span> 어린이
            </div>
            <p className="text-xl text-slate-600 font-black leading-relaxed break-keep">
              위 어린이는 사건의 순서를<br/>올바르게 이해하고 설명하였기에<br/>이 상장을 수여합니다.
            </p>
          </div>
          <div className="flex-1 flex flex-col justify-center gap-4">
            <div className="bg-blue-50 p-6 rounded-2xl border-4 border-blue-200 flex flex-col items-center">
              <div className="text-2xl font-black text-slate-700 mb-3">최종 결과</div>
              <div className="text-7xl font-black text-blue-500">{score} <span className="text-4xl text-slate-400">/ {activeQuestions.length}</span></div>
            </div>
            <div className="bg-orange-50 p-4 rounded-2xl border-4 border-orange-200 flex justify-around">
              <div className="text-center">
                <div className="text-base font-black text-slate-500">🙋 도움받기</div>
                <div className="text-3xl font-black text-orange-600">{helpUsedTotal}회</div>
              </div>
              <div className="text-center">
                <div className="text-base font-black text-slate-500">🎙️ 녹음</div>
                <div className="text-3xl font-black text-orange-600">{allReflections.length}회</div>
              </div>
            </div>
            <button onClick={downloadReport} 
              className="w-full bg-green-500 hover:bg-green-600 text-white text-2xl py-5 rounded-2xl font-black shadow-lg flex items-center justify-center gap-3 transition active:scale-95">
              <span className="text-4xl">📥</span> 수료증 저장하기
            </button>
            <button onClick={() => window.location.reload()} 
              className="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 text-xl py-4 rounded-2xl font-black border-4 border-slate-300 transition active:scale-95">
              처음으로 돌아가기
            </button>
          </div>
        </div>
      </div>
    );

    return null;
  };

  return (
    <>
      <div 
        className="scale-stage"
        style={{transform: `translate(-50%, -50%) scale(${scale})`}}
      >
        {renderContent()}
      </div>
      {tutorialOpen && <TutorialPopup onClose={() => setTutorialOpen(false)}/>}
      {toast && <div className="toast">{toast}</div>}
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
